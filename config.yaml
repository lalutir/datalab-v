# Azure Blob Storage settings
azure:
  container_name: "era5-data"
  blob_prefix: ""
  # Files are named: era5_{YYYY}_{MM}.zip, e.g. era5_2024_08.zip
  # {year} is replaced with values from selection.blob_files below.
  blob_pattern: "era5_{year}.zip"

# Subset selection
selection:
  # Year range to process. The pipeline downloads all 12 months per year automatically.
  # Available in Azure: 1990-2025
  year_start: 2000
  year_end: 2025

  # All 15 ERA5 variables present in the ZIP files
  variables:
    # Instant variables (snapshot at each 6-hour step)
    - u10
    - v10
    - d2m
    - t2m
    - sp
    - swvl1
    - swvl2
    # Accumulated variables (total over the 6-hour step)
    - tp
    - ssrd
    - e
    - pev
    - ssro
    - sro
    - lsp
    - vimd

  # Single grid point (lat_min == lat_max triggers nearest-neighbour selection)
  bbox:
    lat_min: 9.25
    lat_max: 9.25
    lon_min: 42.75
    lon_max: 42.75

# Processing settings
processing:
  # Dask chunk sizes for lazy loading
  chunks:
    time: 100
    latitude: 50
    longitude: 50

  # Resample hourly data to this frequency. Set to null to skip.
  resample_freq: "1D"

  # Aggregation method per variable when resampling to daily
  # Instant variables -> mean; accumulated variables -> sum
  agg_methods:
    u10: mean
    v10: mean
    d2m: mean
    t2m: mean
    sp: mean
    swvl1: mean
    swvl2: mean
    tp: sum
    ssrd: sum
    e: sum
    pev: sum
    ssro: sum
    sro: sum
    lsp: sum
    vimd: sum

# Output settings
output:
  dir: "data/processed"
  format: "parquet"  # Options: zarr, parquet, both
